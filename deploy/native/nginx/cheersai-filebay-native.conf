map $http_referer $cheersai_api_upstream {
    default 127.0.0.1:3000;
    ~*/ragflow/ 127.0.0.1:9380;
}

map $http_referer $cheersai_static_upstream {
    default 127.0.0.1:3000;
    ~*/ragflow/ 127.0.0.1:9380;
}

server {
    listen 127.0.0.1:13080;
    server_name _;
    client_max_body_size 100m;

    location = /ragflow {
        return 302 /ragflow/;
    }

    location = /ragflow/cheersai-logo.svg {
        proxy_pass http://127.0.0.1:3000/assets/img/logo.svg;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /ragflow/assets/ {
        alias /var/lib/cheersai-ragflow/web/dist/assets/;
        try_files $uri =404;
    }

    location = /ragflow/filebay-shell.css {
        alias /var/lib/cheersai-ragflow/web/dist/filebay-shell.css;
    }

    location = /ragflow/filebay-shell.js {
        alias /var/lib/cheersai-ragflow/web/dist/filebay-shell.js;
    }

    location ^~ /ragflow/ {
        alias /var/lib/cheersai-ragflow/web/dist/;
        try_files $uri $uri/ /ragflow/index.html;
    }

    location ~ ^/(api|v1)/ {
        proxy_pass http://$cheersai_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /conf.json {
        proxy_pass http://$cheersai_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /logo.svg {
        proxy_pass http://$cheersai_static_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
