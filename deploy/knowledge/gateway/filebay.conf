map $http_referer $filebay_api_upstream {
    default filebay:3000;
    ~*/ragflow/ ragflow-cpu:80;
}

# A small number of upstream RAGFlow UI components still reference public
# assets with an absolute URL. Keep those assets on the same origin and select
# the backend from the page that requested them, just like the API proxy.
map $http_referer $filebay_static_upstream {
    default filebay:3000;
    ~*/ragflow/ ragflow-cpu:80;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    # FileBay may be recreated independently during a controlled upgrade.
    # Resolve the Docker service name at request time so this one public
    # gateway does not keep a stale container IP and return 502 afterwards.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $filebay_upstream filebay:3000;

    location = /ragflow {
        return 302 /ragflow/;
    }

    # The RAGFlow SPA is compiled with /ragflow/ as its base path. Strip the
    # prefix only when forwarding to the unmodified official RAGFlow server.
    location ^~ /ragflow/ {
        proxy_pass http://ragflow-cpu:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RAGFlow keeps absolute API URLs. Requests initiated from /ragflow/ are
    # selected by their browser referrer, while FileBay requests stay with
    # FileBay. Neither backend API is independently exposed to the host.
    location ~ ^/(api|v1)/ {
        proxy_pass http://$filebay_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /conf.json {
        proxy_pass http://$filebay_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /logo.svg {
        proxy_pass http://$filebay_static_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://$filebay_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
