version: "2"

linters:
  exclusions:
    rules:
      - path: ^routers/api/v1/swagger/.*\.go$
        linters:
          - unused
      - path: ^routers/api/v1/user/gpg_key\.go$
        text: 'type swagger.* is unused'
        linters:
          - unused
      - path: _test\.go$
        linters:
          - errcheck
      - path: ^models/migrations/
        linters:
          - errcheck
      - path: ^models/migrations/
        text: '^ST1005:'
        linters:
          - staticcheck
      - text: 'Error return value of `.*\.Close` is not checked'
        linters:
          - errcheck
